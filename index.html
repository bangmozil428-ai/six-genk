<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> <!-- INI PENTING BIAR GAK KECIL -->
<title>SIX GENK | Dashboard</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; font-family:'Arial'; background:#0a0a0a; color:#eee; font-size:16px} /* font gedein */
  
  /* LOGIN */
  #loginBox{background:#111; width:90%; max-width:400px; margin:50px auto; padding:25px; border-radius:15px; border:2px solid #8b5cf6; text-align:center}
  input, textarea{width:100%; padding:14px; font-size:16px; margin:10px 0; background:#000; border:1px solid #333; border-radius:8px; color:white}
  .btn-login{background:#8b5cf6; color:white; padding:14px; border:none; border-radius:8px; cursor:pointer; width:100%; font-weight:bold; font-size:16px}
  
  /* DASHBOARD */
  #dashboard{display:none; background:linear-gradient(135deg,#1e1b4b,#7c3aed,#ec4899); min-height:100vh}
  header{padding:12px 15px; display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.4)}
  .logo{padding:8px 15px; border-radius:12px; font-size:16px}
  .logout{padding:8px 15px; font-size:14px}
  
  .container{padding:15px} /* padding dikecilin buat hp */
  
  .banner{height:180px; border-radius:15px; margin-bottom:15px}
  
  /* SAPAAN GEDE */
  h2{font-size:22px; margin:10px 0}
  
  /* PROFIL */
  .profile-card{padding:15px; border-radius:15px; display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.4)}
  .avatar{width:50px; height:50px; font-size:24px}
  .profile-info b{font-size:18px}
  
  /* AGENDA */
  .agenda{padding:15px; border-radius:15px; margin:15px 0}
  .agenda h3{font-size:18px}
  .agenda-item{font-size:15px; padding:12px}
  
  /* GALERI FULL WIDTH */
  .galeri{display:grid; grid-template-columns:1fr; gap:15px; margin-top:15px} /* 1 kolom di HP */
  .foto{padding:12px; border-radius:15px; background:rgba(0,0,0,0.4)}
  .foto img{width:100%; border-radius:10px; min-height:200px; object-fit:cover} /* FOTO GEDE */
  .caption{font-size:15px; margin-top:8px}
  .caption b{font-size:16px}
  
  .btn-hapus{width:32px; height:32px; font-size:16px}
  .admin-panel{padding:15px}
  .btn-tambah{width:100%; padding:14px; font-size:16px}
  
  /* TABLET/PC BARU 2 KOLOM */
  @media(min-width:768px){
    .galeri{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <h1 style="color:#8b5cf6">🔒 SIX GENK 🔒</h1>
  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">
  <button class="btn-login" onclick="login()">MASUK</button>
  <p class="error" id="error" style="color:red; display:none">Username atau Password Salah!</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="logo" style="background:#8b5cf6; color:white">SIX GENK</div>
    <button class="logout" style="background:#ef4444; color:white; border:none; border-radius:8px" onclick="logout()">LOGOUT</button>
  </header>
    
    <h2 id="sapaan">🌙 Good Evening, User!</h2>
    
    <div class="profile-card">
      <div class="avatar" style="background:linear-gradient(135deg,#8b5cf6,#ec4899); color:white">👤</div>
      <div class="profile-info">
        <b id="namaProfile">@User</b>
        <p id="status">Member</p>
        <p id="waktu">--:-- --/--/----</p>
      </div>
    </div>
    
    <div class="agenda">
      <h3 style="color:#ec4899">📅 Agenda Selanjutnya</h3>
      <div id="listAgenda"></div>
      <div id="formAgenda" class="admin-panel" style="display:none; border:2px dashed #8b5cf6; margin-top:10px">
        <input type="text" id="judulAgenda" placeholder="Judul Agenda">
        <input type="date" id="tanggalAgenda">
        <button class="btn-tambah" style="background:#10b981" onclick="tambahAgenda()">+ Tambah Agenda</button>
      </div>
    </div>
    
    <h3 style="margin-top:20px">📸 Galeri Six Genk</h3>
    <div id="formGaleri" class="admin-panel" style="display:none; border:2px dashed #8b5cf6">
      <input type="text" id="judulFoto" placeholder="Judul Foto">
      <input type="text" id="linkFoto" placeholder="Link Foto dari imgbb">
      <textarea id="captionFoto" placeholder="Caption"></textarea>
      <button class="btn-tambah" style="background:#10b981" onclick="tambahFoto()">+ Tambah Foto</button>
    </div>
    <div class="galeri" id="listGaleri"></div>
    
  </div>
</div>

<script>
let currentUser = "";
let isAdmin = false;
let dataGaleri = JSON.parse(localStorage.getItem('galeriSixGenk')) || [
  {judul:"BW / Banyu Wangi", link:"https://ar-hosting.pages.dev/1785080606233.jpg", caption:"Yang penting basah bareng"}
];
let dataAgenda = JSON.parse(localStorage.getItem('agendaSixGenk')) || [];

const akun = [
  {user:"Rizky", pass:"admin"},
  {user:"izad", pass:"izad123"},
  {user:"tian", pass:"tian aja"},
  {user:"Lola", pass:"lola cantik"},
  {user:"Vara", pass:"vara imut"},
  {user:"ira", pass:"najuwa"}
];

function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;
  let cek = akun.find(a => a.user === u && a.pass === p);
  
  if(cek){
    currentUser = cek.user;
    isAdmin = (cek.user === "Rizky");
    
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    
    document.getElementById("namaProfile").innerText = "@" + cek.user;
    document.getElementById("status").innerText = isAdmin ? "Admin" : "Member";
    
    let jam = new Date().getHours();
    let sapa = jam < 11 ? "Good Morning" : jam < 15 ? "Good Afternoon" : jam < 18 ? "Good Evening" : "Good Night";
    document.getElementById("sapaan").innerText = `🌙 ${sapa}, ${cek.user}!`;
    
    let now = new Date();
    document.getElementById("waktu").innerText = now.toLocaleTimeString() + " • " + now.toLocaleDateString();
    
    if(isAdmin){
      document.getElementById("formGaleri").style.display = "block";
      document.getElementById("formAgenda").style.display = "block";
    }
    
    loadGaleri();
    loadAgenda();
  } else {
    document.getElementById("error").style.display = "block";
  }
}

function logout(){ location.reload(); }

function loadGaleri(){
  let html = "";
  dataGaleri.forEach((g,i) => {
    html += `
    <div class="foto">
      ${isAdmin ? `<button class="btn-hapus" style="position:absolute; background:red; color:white; border:none; border-radius:50%" onclick="hapusFoto(${i})">X</button>` : ""}
      <img src="${g.link}" alt="${g.judul}">
      <div class="caption"><b>${g.judul}</b><br>${g.caption}</div>
    </div>`;
  });
  document.getElementById("listGaleri").innerHTML = html;
}

function tambahFoto(){
  let j = document.getElementById("judulFoto").value;
  let l = document.getElementById("linkFoto").value;
  let c = document.getElementById("captionFoto").value;
  if(j && l){
    dataGaleri.push({judul:j, link:l, caption:c});
    localStorage.setItem('galeriSixGenk', JSON.stringify(dataGaleri));
    loadGaleri();
    document.getElementById("judulFoto").value = "";
    document.getElementById("linkFoto").value = "";
    document.getElementById("captionFoto").value = "";
  }
}

function hapusFoto(i){
  if(confirm("Yakin mau hapus foto ini?")){
    dataGaleri.splice(i,1);
    localStorage.setItem('galeriSixGenk', JSON.stringify(dataGaleri));
    loadGaleri();
  }
}

function loadAgenda(){
  let html = "";
  dataAgenda.forEach((a,i) => {
    html += `<div class="agenda-item" style="background:#222; margin:8px 0; display:flex; justify-content:space-between">
      <span><b>${a.judul}</b> - ${a.tanggal}</span>
      ${isAdmin ? `<button style="background:red; color:white; border:none; border-radius:5px" onclick="hapusAgenda(${i})">x</button>` : ""}
    </div>`;
  });
  document.getElementById("listAgenda").innerHTML = html;
}

function tambahAgenda(){
  let j = document.getElementById("judulAgenda").value;
  let t = document.getElementById("tanggalAgenda").value;
  if(j && t){
    dataAgenda.push({judul:j, tanggal:t});
    localStorage.setItem('agendaSixGenk', JSON.stringify(dataAgenda));
    loadAgenda();
    document.getElementById("judulAgenda").value = "";
  }
}

function hapusAgenda(i){
  dataAgenda.splice(i,1);
  localStorage.setItem('agendaSixGenk', JSON.stringify(dataAgenda));
  loadAgenda();
}
</script>

</body>
</html>
